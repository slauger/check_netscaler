name: Lint and Type Check

on:
  push:
    branches:
      - '**'

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff (linting)
        run: ruff check src/ tests/ --output-format=github

      - name: Run black (code formatting check)
        run: black --check --diff src/ tests/

      - name: Run mypy (type checking)
        run: mypy src/check_netscaler/

      - name: Run tests
        run: pytest tests/ -vv --tb=short

  summary:
    name: Lint and Type Check Summary
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.lint-and-type-check.result }}" == "success" ]; then
            echo "✅ All lint and type checks passed!"
          else
            echo "❌ Some checks failed. Please review the logs above."
            exit 1
          fi
