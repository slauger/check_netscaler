[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "check_netscaler"
version = "3.0.0"
description = "Nagios/Icinga monitoring plugin for Citrix NetScaler ADC using NITRO REST API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Simon Lauger", email = "simon@lauger.de"}
]
keywords = ["nagios", "icinga", "monitoring", "netscaler", "citrix", "adc"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=25.9.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "types-requests>=2.31.0",
    "flask>=2.3.0",
]

[project.scripts]
check_netscaler = "check_netscaler.__main__:main"

[project.urls]
Homepage = "https://github.com/slauger/check_netscaler"
Repository = "https://github.com/slauger/check_netscaler"
Issues = "https://github.com/slauger/check_netscaler/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py312', 'py313', 'py314']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "src/check_netscaler/__init__.py:__version__",
]
branch = "master"
upload_to_pypi = false
upload_to_release = true
build_command = "pip install build && python -m build"
commit_parser = "angular"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
template_dir = ".github/semantic_release"
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
trim_blocks = true
lstrip_blocks = true
keep_trailing_newline = false
